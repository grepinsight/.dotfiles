# English fix autocorrect: articles.
#
# PUBLIC REPO. Generic English only, in the entries AND in these comments: no employer,
# product, internal repo, person, host, filesystem path, or machine name.
# Only article fixes where the wrong string is never correct in any context.
# `word: true` is mandatory: without it "use cache" would fire inside "use cached".

matches:
  - trigger: "being outlier"
    replace: "being an outlier"
    word: true
    propagate_case: true

  - trigger: "is outlier"
    replace: "is an outlier"
    word: true
    propagate_case: true

  # Kept deliberately despite the risk below. Known false positive: "use cache
  # headers", "use cache invalidation" and similar compounds are legitimate and will
  # be rewritten too. Delete this entry if that bites.
  - trigger: "use cache"
    replace: "use a cache"
    word: true
    propagate_case: true
  - trigger: "a alias"
    replace: "an alias"
    word: true
    propagate_case: true
  # Vowel-sound noun: "a" is never correct before it.
  - trigger: "a eraser"
    replace: "an eraser"
    word: true
    propagate_case: true

  - trigger: "an permission"
    replace: "a permission"
    word: true
    propagate_case: true

  - trigger: "take sabbatical"
    replace: "take a sabbatical"
    word: true
    propagate_case: true

  # Singular countable noun only: "give me concise answers/feedback" needs no article.
  - trigger: "give me concise draft"
    replace: "give me a concise draft"
    word: true
    propagate_case: true

  # "a" before a vowel sound; "a appropriate" is never correct.
  - trigger: "a appropriate"
    replace: "an appropriate"
    word: true
    propagate_case: true

  # Determiner typed twice around a quantifier; "the all the" is never correct.
  - trigger: "the all the"
    replace: "all the"
    word: true
    propagate_case: true

  # Fixed idiom "to the human eye"; the bare form is never correct.
  - trigger: "invisible to human eye"
    replace: "invisible to the human eye"
    word: true
    propagate_case: true

  # Singular count noun with a vowel sound; "create evergreen note" is never correct.
  - trigger: "create evergreen note"
    replace: "create an evergreen note"
    word: true
    propagate_case: true

  # Ethernet starts with a vowel sound; "a ethernet" is never correct.
  - trigger: "a ethernet"
    replace: "an ethernet"
    word: true
    propagate_case: true
  - trigger: "am bit confused"
    replace: "am a bit confused"
    word: true
    propagate_case: true
  - trigger: "what's shortcut"
    replace: "what's the shortcut"
    word: true
    propagate_case: true
  - trigger: "a explainer"
    replace: "an explainer"
    word: true
    propagate_case: true
  - trigger: "add ability to"
    replace: "add the ability to"
    word: true
    propagate_case: true
  - trigger: "a official"
    replace: "an official"
    word: true
    propagate_case: true
  - trigger: "for long time"
    replace: "for a long time"
    word: true
    propagate_case: true
  - trigger: "a evil"
    replace: "an evil"
    word: true
    propagate_case: true
  - trigger: "a executable"
    replace: "an executable"
    word: true
    propagate_case: true
  - trigger: "a installed"
    replace: "an installed"
    word: true
    propagate_case: true
