# English fix autocorrect: idiom and phrasing.
#
# PUBLIC REPO. Generic English only, in the entries AND in these comments.
# Only fixed idioms where the wrong string is never correct in any context.

matches:
  # `turn X into Y` is the idiom; `turn it as` is never correct.
  - trigger: "turn it as a"
    replace: "turn it into a"
    word: true
    propagate_case: true

  # pbcopy is a command you send data TO, never a container data sits IN.
  # Three different prepositions were tried across four attempts before this one.
  # No legitimate "in pbcopy" exists.
  - trigger: "in pbcopy"
    replace: "to pbcopy"
    word: true
    propagate_case: true
  # `business days` and `working days` are the same unit; stacking both is never correct.
  - trigger: "business working days"
    replace: "business days"
    word: true
    propagate_case: true

  # `do` before a bare verb only works in a question, a negation, or an emphatic.
  # A `to`-infinitive has no slot for it, so `to do get` is never correct.
  - trigger: "to do get"
    replace: "to get"
    word: true
    propagate_case: true

  # `big of a` is licensed only after a degree word (that / too / so / how / this).
  # With none present the `of` has nothing to attach to, so this is never correct.
  - trigger: "not big of a"
    replace: "not that big of a"
    word: true
    propagate_case: true
