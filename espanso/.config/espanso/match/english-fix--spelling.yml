# English fix autocorrect: spelling and word form.
#
# PUBLIC REPO. Generic English only, in the entries AND in these comments.
# Only strings that are never correct in any context, which makes this the safest file
# of the set. `word: true` keeps a trigger from firing inside a longer word.

matches:
  - trigger: "maintable"
    replace: "maintainable"
    word: true
    propagate_case: true

  - trigger: "idividually"
    replace: "individually"
    word: true
    propagate_case: true

  - trigger: "proceess"
    replace: "processes"
    word: true
    propagate_case: true

  - trigger: "re-write"
    replace: "rewrite"
    word: true
    propagate_case: true

  - trigger: "teh"
    replace: "the"
    word: true
    propagate_case: true

  - trigger: "espected"
    replace: "expected"
    word: true
    propagate_case: true

  - trigger: "cannonical"
    replace: "canonical"
    word: true
    propagate_case: true

  - trigger: "compilant"
    replace: "compliant"
    word: true
    propagate_case: true

  - trigger: "filesytems"
    replace: "filesystems"
    word: true
    propagate_case: true

  - trigger: "sabatical"
    replace: "sabbatical"
    word: true
    propagate_case: true

  - trigger: "antomic"
    replace: "atomic"
    word: true
    propagate_case: true

  - trigger: "thousdand"
    replace: "thousand"
    word: true
    propagate_case: true

  # Doubled initial letter; never a word.
  - trigger: "ssabbatical"
    replace: "sabbatical"
    word: true
    propagate_case: true

  - trigger: "sfhit"
    replace: "shift"
    word: true
    propagate_case: true

  - trigger: "resontates"
    replace: "resonates"
    word: true
    propagate_case: true

  - trigger: "resontate"
    replace: "resonate"
    word: true
    propagate_case: true

  - trigger: "birthay"
    replace: "birthday"
    word: true
    propagate_case: true

  - trigger: "vanila"
    replace: "vanilla"
    word: true
    propagate_case: true

  # Transposed letters; never a word.
  - trigger: "specifcying"
    replace: "specifying"
    word: true
    propagate_case: true

  # Tripled vowel in a config key; never a word.
  - trigger: "weeekstart"
    replace: "weekStart"
    word: true
    propagate_case: true

  - trigger: "highlevel"
    replace: "high-level"
    word: true
    propagate_case: true

  - trigger: "shoudl"
    replace: "should"
    word: true
    propagate_case: true

  - trigger: "sub millisecond"
    replace: "sub-millisecond"
    word: true
    propagate_case: true
  - trigger: "phrse"
    replace: "phrase"
    word: true
    propagate_case: true
  - trigger: "notesl"
    replace: "notes"
    word: true
    propagate_case: true

  - trigger: "nound"
    replace: "noun"
    word: true
    propagate_case: true

  - trigger: "auto update"
    replace: "auto-update"
    word: true
    propagate_case: true
  # Compound modifier, same shape as the entry above but noun+participle rather
  # than a bound prefix. Predicative use ("the plugin is battle tested") is
  # defensible unhyphenated, so this trigger does fire there, but the hyphenated
  # form is the dictionary headword, so the rewrite stays correct either way.
  - trigger: "battle tested"
    replace: "battle-tested"
    word: true
    propagate_case: true
  - trigger: "unsreadable"
    replace: "unreadable"
    word: true
    propagate_case: true
  - trigger: "refeering"
    replace: "referring"
    word: true
    propagate_case: true
  - trigger: "fastqest"
    replace: "fastest"
    word: true
    propagate_case: true
  - trigger: "publically"
    replace: "publicly"
    word: true
    propagate_case: true
  - trigger: "render it nice"
    replace: "render it nicely"
    word: true
    propagate_case: true
  - trigger: "dimenional"
    replace: "dimensional"
    word: true
    propagate_case: true
  - trigger: "conver"
    replace: "convert"
    word: true
    propagate_case: true
  - trigger: "beacuse"
    replace: "because"
    word: true
    propagate_case: true
  - trigger: "offical"
    replace: "official"
    word: true
    propagate_case: true
  - trigger: "cand"
    replace: "can"
    word: true
