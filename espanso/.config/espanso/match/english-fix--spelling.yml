    replace: "knowledge"
    word: true
    propagate_case: true
  # Adjacent letters swapped; not a word.
  - trigger: "moduels"
    replace: "modules"
    word: true
    propagate_case: true
  # Adjacent letters swapped; not a word.
  - trigger: "direcotry"
