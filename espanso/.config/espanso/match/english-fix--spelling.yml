  - trigger: "scription"
    replace: "description"
    word: true
    propagate_case: true

  - trigger: "opnions"
    replace: "opinions"
    word: true
    propagate_case: true
  - trigger: "whcih"
    replace: "which"
    word: true
    propagate_case: true

  # `orgwide` is not a word; the compound modifier takes a hyphen.
  - trigger: "orgwide"
    replace: "org-wide"
    word: true
    propagate_case: true

  # Adjacent-key transposition; not a word in any context.
  - trigger: "cladue"
    replace: "Claude"
    word: true
    propagate_case: true

  # `local` + `-ly` keeps both l's.
  - trigger: "localy"
    replace: "locally"
    word: true
    propagate_case: true

  # A space landing one character early inside `and`.
  - trigger: "a nd"
    replace: "and"
    word: true
    propagate_case: true
  # The `s` in `os` dropped from the command name.
  - trigger: "oascript"
    replace: "osascript"
    word: true
    propagate_case: true
  # Two words fused by a dropped space; not a word on its own.
  - trigger: "canquickly"
    replace: "can quickly"
    word: true
    propagate_case: true
  # `lemma` carries the double m, so the derived verb keeps it.
  - trigger: "lematize"
    replace: "lemmatize"
    word: true
    propagate_case: true
  # A determiner in front forces the noun reading, and the noun is hyphenated.
  # `follow up` without a determiner is the verb and is left alone.
  - trigger: "the follow up"
    replace: "the follow-up"
    word: true
    propagate_case: true
  - trigger: "a follow up"
    replace: "a follow-up"
    word: true
    propagate_case: true
  - trigger: "entiteis"
