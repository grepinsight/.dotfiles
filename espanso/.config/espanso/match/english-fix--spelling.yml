# English fix autocorrect: spelling and word form.
#
# PUBLIC REPO. Generic English only, in the entries AND in these comments.
# Only strings that are never correct in any context, which makes this the safest file
# of the set. `word: true` keeps a trigger from firing inside a longer word.

matches:
  - trigger: "maintable"
    replace: "maintainable"
    word: true
    propagate_case: true

  - trigger: "idividually"
    replace: "individually"
    word: true
    propagate_case: true

  - trigger: "proceess"
    replace: "processes"
    word: true
    propagate_case: true

  - trigger: "re-write"
    replace: "rewrite"
    word: true
    propagate_case: true

  - trigger: "teh"
    replace: "the"
    word: true
    propagate_case: true

  - trigger: "espected"
    replace: "expected"
    word: true
    propagate_case: true

  - trigger: "cannonical"
    replace: "canonical"
    word: true
    propagate_case: true

  - trigger: "compilant"
    replace: "compliant"
    word: true
    propagate_case: true

  - trigger: "filesytems"
    replace: "filesystems"
    word: true
    propagate_case: true

  - trigger: "sabatical"
    replace: "sabbatical"
    word: true
    propagate_case: true

  - trigger: "antomic"
    replace: "atomic"
    word: true
    propagate_case: true

  - trigger: "thousdand"
    replace: "thousand"
    word: true
    propagate_case: true

  # Doubled initial letter; never a word.
  - trigger: "ssabbatical"
    replace: "sabbatical"
    word: true
    propagate_case: true

  - trigger: "sfhit"
    replace: "shift"
    word: true
    propagate_case: true

  - trigger: "resontates"
    replace: "resonates"
    word: true
    propagate_case: true

  - trigger: "resontate"
    replace: "resonate"
    word: true
    propagate_case: true

  - trigger: "birthay"
    replace: "birthday"
    word: true
    propagate_case: true

  - trigger: "vanila"
    replace: "vanilla"
    word: true
    propagate_case: true

  # Transposed letters; never a word.
  - trigger: "specifcying"
    replace: "specifying"
    word: true
    propagate_case: true

  # Tripled vowel in a config key; never a word.
  - trigger: "weeekstart"
    replace: "weekStart"
    word: true
    propagate_case: true
